# k3d on your laptop:
#   helm upgrade --install team charts/gateway -n mercora -f deploy/gateway-values-local.yaml
mode: control
ingress:
  host: gateway.localhost
cookieSecure: false
stores:
  enabled: true
# The demo servers and the mercora store's woo-mcp live in this namespace (README).
upstreamAllowHosts: "woo-mcp-woo-mcp.mercora.svc.cluster.local,notes.mercora.svc.cluster.local,fx.mercora.svc.cluster.local"
# The mercora store's woo-mcp (charts/store + charts/woo-mcp), registered at first-run setup.
seedServer:
  url: http://woo-mcp-woo-mcp.mercora.svc.cluster.local:8000/mcp
