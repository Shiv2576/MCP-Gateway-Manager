# VPS (k3s), after deploy/tls-prod.yaml is applied:
#   helm upgrade --install store-operator charts/store-operator -n mercora -f deploy/store-operator-values-prod.yaml
# Set by CI (.github/workflows/ci.yaml) to the commit it built; Argo CD deploys it.
image:
  repository: ghcr.io/shiv2576/store-operator
  tag: "cc6ebb35ec8ac7b0cfa95711b5410e37b2f310d2"
gatewayUrl: http://team-gateway:8000
maxStores: 5
edgeImageRepository: ghcr.io/shiv2576/gateway
edgeImageTag: "622142a1c7be354d0ae941b79ff6bf4844058131"
wooMcpImage:
  repository: ghcr.io/shiv2576/woo-mcp
  tag: "2c832c63496ab54a4e5ce0404787cc6d4c7fdbf0"
# Stores at https://<name>.2001-41d0-303-2774--94.sslip.io, edges at https://<slug>.gw.2001-41d0-303-2774--94.sslip.io,
# each Ingress with its own Let's Encrypt certificate (HTTP-01).
baseDomain: 2001-41d0-303-2774--94.sslip.io
urlScheme: https
clusterIssuer: letsencrypt
# Optional: tailnetDomain: <tailnet>.ts.net serves stores through Tailscale Funnel instead
# (IPv4 too, but each new store name takes ~5-10 min to work; docs/deploy-vps.md). Off.
