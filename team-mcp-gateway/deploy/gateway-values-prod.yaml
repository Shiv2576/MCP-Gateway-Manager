# VPS (k3s). Images are imported into k3s (docs/deploy-vps.md), so the chart's image defaults apply.
#   helm upgrade --install team charts/gateway -n mercora -f deploy/gateway-values-prod.yaml
mode: control
ingress:
  host: gateway.2001-41d0-303-2774--94.sslip.io
# Served over https (TLS ends at Traefik), so the session cookie is https-only.
cookieSecure: true
stores:
  enabled: true
  maxPerAdmin: 10
# Stores are <name>.2001-41d0-303-2774--94.sslip.io and edges <slug>.gw.2001-41d0-303-2774--94.sslip.io, over https.
baseDomain: 2001-41d0-303-2774--94.sslip.io
urlScheme: https
# The demo servers and the mercora store's woo-mcp live in this namespace (README).
upstreamAllowHosts: "woo-mcp-woo-mcp.mercora.svc.cluster.local,notes.mercora.svc.cluster.local,fx.mercora.svc.cluster.local"
# The mercora store's woo-mcp (charts/store + charts/woo-mcp), registered at first-run setup.
seedServer:
  url: http://woo-mcp-woo-mcp.mercora.svc.cluster.local:8000/mcp
# Every new gateway: https://<slug>-gw.tailff0a64.ts.net over Tailscale Funnel (IPv4 too).
tailnetDomain: tailff0a64.ts.net
