{{- if .Values.networkPolicy.enabled }}
# Selecting these pods with an Ingress policy flips them to "deny by default":
# only the sources listed below may open a connection. Everything else in the
# cluster, including the storefront, is refused at the network layer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "woo-mcp.name" . }}
  labels:
    {{- include "woo-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "woo-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowFromPodLabels | nindent 14 }}
          {{- with .Values.networkPolicy.allowFromNamespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          {{- end }}
      ports:
        - protocol: TCP
          port: 8000
  # Outbound: only this namespace's WordPress, plus DNS. woo-mcp never needs
  # anything else, so it cannot reach another store.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
