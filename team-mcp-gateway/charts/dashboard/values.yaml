image:
  repository: dashboard
  tag: "0.9.8"
  pullPolicy: IfNotPresent

# The gateway Service that nginx forwards /api to.
gatewayUrl: http://team-gateway:8000

ingress:
  enabled: true
  className: traefik
  host: dash.localhost

# Set (e.g. "dash"): also serve the dashboard at https://dash.<tailnet>.ts.net through
# Tailscale Funnel (IPv4 too). Needs the Tailscale operator in tailscale.namespace.
tailscale:
  hostname: ""
  namespace: tailscale

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
