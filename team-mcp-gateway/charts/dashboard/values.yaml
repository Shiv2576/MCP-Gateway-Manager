image:
  repository: dashboard
  tag: "0.9.7"
  pullPolicy: IfNotPresent

# The gateway Service that nginx forwards /api to.
gatewayUrl: http://team-gateway:8000

ingress:
  enabled: true
  className: traefik
  host: dash.localhost

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
