apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-operator
---
# Broad on purpose: Helm installs WordPress, MariaDB and woo-mcp into a new
# namespace per store. Only this pod holds these rights; the gateway can only
# create Store objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-store-operator
rules:
  - apiGroups: ["mcpgateway.example.com"]
    resources: ["stores", "stores/status", "mcpgateways", "mcpgateways/status", "hostedservers", "hostedservers/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets", "configmaps", "services", "persistentvolumeclaims", "serviceaccounts", "pods"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-store-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-store-operator
subjects:
  - kind: ServiceAccount
    name: store-operator
    namespace: {{ .Release.Namespace }}
