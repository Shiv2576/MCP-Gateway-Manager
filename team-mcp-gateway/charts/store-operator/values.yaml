image:
  repository: store-operator
  tag: "0.7.7"
  pullPolicy: IfNotPresent
# The gateway's Service inside this namespace.
gatewayUrl: http://team-gateway:8000
# Secret in this namespace with GATEWAY_API_KEY: an admin API key from the dashboard.
existingSecret: store-operator-gateway
# Where stores (<name>.baseDomain) and edges (<slug>.gw.baseDomain) are served,
# over urlScheme. clusterIssuer set: each store and edge Ingress gets its own
# cert-manager certificate. Local: localhost, http, none.
baseDomain: localhost
urlScheme: http
clusterIssuer: ""
# Set (e.g. tail1234.ts.net): stores are served at https://<name>-shop.<tailnet> through
# Tailscale Funnel instead of <name>.baseDomain. Needs the Tailscale operator.
tailnetDomain: ""
# Stores each admin may have. Keep equal to the gateway's stores.maxPerAdmin.
maxStores: 3
# Gateway image every edge (McpGateway) is installed with, and woo-mcp image of every
# store. On a change the operator upgrades its existing edges and woo-mcps to it.
edgeImageRepository: gateway
edgeImageTag: "0.10.5"
wooMcpImage:
  repository: woo-mcp
  tag: "0.5.0"
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
# Pod CIDR, Service CIDR (k3s defaults) and cloud metadata: never reachable
# through the operator's Kubernetes API rule.
clusterCidrs: ["10.42.0.0/16", "10.43.0.0/16", "169.254.0.0/16"]
