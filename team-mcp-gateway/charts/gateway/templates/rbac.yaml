{{- if and (eq .Values.mode "control") .Values.stores.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gateway.name" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
---
# Only Store, McpGateway and HostedServer objects in this namespace. Provisioning rights stay with the operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gateway.name" . }}-stores
rules:
  - apiGroups: ["mcpgateway.example.com"]
    resources: ["stores", "mcpgateways", "hostedservers"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gateway.name" . }}-stores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gateway.name" . }}-stores
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.name" . }}
    namespace: {{ .Release.Namespace }}
---
# Read-only CPU/memory of pods (metrics-server), for the dashboard's Metrics tab.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "gateway.name" . }}-pod-metrics
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "gateway.name" . }}-pod-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "gateway.name" . }}-pod-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.name" . }}
    namespace: {{ .Release.Namespace }}
---
# Lets the gateway ask the API server whose token the store operator sent (TokenReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "gateway.name" . }}-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
