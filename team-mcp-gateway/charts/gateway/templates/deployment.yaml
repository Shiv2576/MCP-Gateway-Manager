apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.name" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  # SQLite: exactly one pod, and the old one stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        # app.kubernetes.io/name: gateway is the label upstream NetworkPolicies allow.
        {{- include "gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.stores.enabled }}
      serviceAccountName: {{ include "gateway.name" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /data/gateway.db
            - name: CALL_TIMEOUT_S
              value: {{ .Values.callTimeoutSeconds | quote }}
            - name: LIST_TIMEOUT_S
              value: {{ .Values.listTimeoutSeconds | quote }}
            - name: REFRESH_INTERVAL_S
              value: {{ .Values.refreshIntervalSeconds | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llmModel | quote }}
            {{- with .Values.publicUrl }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oauthRedirectUris }}
            - name: OAUTH_REDIRECT_URIS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.stores.enabled }}
            - name: STORES_NAMESPACE
              value: {{ .Release.Namespace }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "gateway.name" . }}
        - name: tmp
          emptyDir: {}
