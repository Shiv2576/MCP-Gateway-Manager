apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.name" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  # Stateless: everything lives in Postgres, so pods roll one at a time.
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        # app.kubernetes.io/name: gateway is the label upstream and Postgres NetworkPolicies allow.
        {{- include "gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- if and (eq .Values.mode "control") .Values.stores.enabled }}
      serviceAccountName: {{ include "gateway.name" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GATEWAY_MODE
              value: {{ .Values.mode | quote }}
            {{- if eq .Values.mode "edge" }}
            - name: GATEWAY_SLUG
              value: {{ required "slug is required for an edge" .Values.slug | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret }}
                  key: DATABASE_URL
            - name: CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: CREDENTIALS_KEY
            - name: CALL_TIMEOUT_S
              value: {{ .Values.callTimeoutSeconds | quote }}
            - name: LIST_TIMEOUT_S
              value: {{ .Values.listTimeoutSeconds | quote }}
            - name: REFRESH_INTERVAL_S
              value: {{ .Values.refreshIntervalSeconds | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
            {{- if or (ne .Values.baseDomain "localhost") (ne .Values.urlScheme "http") }}
            - name: BASE_DOMAIN
              value: {{ .Values.baseDomain | quote }}
            - name: URL_SCHEME
              value: {{ .Values.urlScheme | quote }}
            {{- end }}
            {{- if and (eq .Values.mode "control") .Values.tailnetDomain }}
            - name: TAILNET_DOMAIN
              value: {{ .Values.tailnetDomain | quote }}
            {{- end }}
            - name: LLM_MODEL
              value: {{ .Values.llmModel | quote }}
            {{- with .Values.publicUrl }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oauthRedirectUris }}
            - name: OAUTH_REDIRECT_URIS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.upstreamAllowHosts }}
            - name: UPSTREAM_ALLOW_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- if and (eq .Values.mode "control") .Values.seedServer.url }}
            - name: SEED_SERVER_URL
              value: {{ .Values.seedServer.url | quote }}
            - name: SEED_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seedServer.tokenSecret }}
                  key: {{ .Values.seedServer.tokenKey }}
                  optional: true  # woo-mcp may be installed after the gateway
            {{- end }}
            {{- if and (eq .Values.mode "control") .Values.stores.enabled }}
            - name: STORES_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: MAX_STORES
              value: {{ .Values.stores.maxPerAdmin | quote }}
            {{- end }}
          {{- if eq .Values.mode "control" }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
