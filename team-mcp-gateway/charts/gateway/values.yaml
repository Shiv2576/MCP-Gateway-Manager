# Defaults. Environment differences live in deploy/gateway-values-*.yaml.

image:
  repository: gateway
  tag: "0.10.5"
  pullPolicy: IfNotPresent

# control: the /api behind the dashboard (one replica). edge: /mcp for one
# gateway's attached servers; the store operator installs edges as gw-<slug>.
mode: control
# Edge only: which gateway this release serves.
slug: ""
replicas: 1

# Secret with DATABASE_URL (key) for the shared Postgres. Both modes.
dbSecret: gateway-db
# Secret with CREDENTIALS_KEY (key): the Fernet key that encrypts members' own
# upstream credentials. Both modes; the gateway does not start without it.
credentialsSecret: gateway-credentials
# Control only. Secret with SETUP_TOKEN (first-run setup) and optionally
# OPENROUTER_API_KEY (dashboard chat agent). The chart never holds them.
existingSecret: gateway-admin

callTimeoutSeconds: 30  # heavy reports (get_inventory_health) page through every product and order
listTimeoutSeconds: 5
refreshIntervalSeconds: 30
# true when the gateway is served over https, so the session cookie is https-only.
cookieSecure: false
# The gateway's public https URL, e.g. https://gateway.example.com (or an ngrok
# URL). Set, it turns on OAuth for /mcp, so a Claude custom connector can sign
# in with a gateway login. API keys work either way.
publicUrl: ""
# Comma-separated redirect URIs OAuth clients may register, besides loopback
# ones. Empty means Claude's callbacks (claude.ai and claude.com).
oauthRedirectUris: ""
# Where stores (<name>.baseDomain) and edges (<slug>.gw.baseDomain) are served,
# over urlScheme. Same as the store operator's values.
baseDomain: localhost
urlScheme: http
# Chat agent model on OpenRouter.
llmModel: openai/gpt-4.1-mini

ingress:
  enabled: true
  className: traefik
  host: gateway.localhost
  extraHosts: []  # e.g. the host of publicUrl; TLS comes from what fronts it (ngrok, cert-manager)
  # A cert-manager ClusterIssuer: set, this Ingress gets its own certificate for its hosts.
  clusterIssuer: ""

# Control plane: a tailnet DNS name (tail1234.ts.net) gives every new gateway
# https://<slug>-gw.<tailnet> unless the admin types a public URL. Needs the
# Tailscale Kubernetes operator with Funnel allowed (docs/deploy-vps.md).
tailnetDomain: ""
# Edge: set by the store operator to "<slug>-gw"; adds a Tailscale Ingress with Funnel on.
tailscale:
  hostname: ""
  namespace: tailscale  # where the Tailscale operator runs its proxies

service:
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Admin-added upstream URLs must resolve to public addresses (SSRF guard). Only the
# store operator registers in-cluster servers: its own store-<name> / mcp-<name> ones.

# Control only: the store's WooCommerce MCP server, registered as server
# "woo-mcp" by first-run setup, so the admin's first login already lists it.
# The bearer token is read from woo-mcp's own Secret; empty url: no seed.
seedServer:
  url: ""
  tokenSecret: woo-mcp-credentials
  tokenKey: MCP_AUTH_TOKEN

networkPolicy:
  enabled: true
  # Pod CIDR, Service CIDR (k3s defaults) and cloud metadata. The gateway's
  # internet rule never reaches these. Change to match your cluster.
  clusterCidrs: ["10.42.0.0/16", "10.43.0.0/16", "169.254.0.0/16"]
  # app.kubernetes.io/name of MCP servers in this namespace the gateway may call on 8000.
  upstreamApps: ["woo-mcp", "notes-mcp", "fx-mcp"]
  # Control release only: a default-deny for every pod in the namespace, plus
  # Traefik → cert-manager solver pods. Every component has its own policy too.
  namespaceDefaultDeny: true

# Store provisioning: the gateway may create/list/delete Store resources in its
# own namespace. Needs the store-operator chart (it installs the CRD).
stores:
  enabled: false
  # Stores each admin may have. Keep equal to the store operator's maxStores.
  maxPerAdmin: 3
  # The store operator's ServiceAccount in this namespace: its token may manage /api/servers.
  operatorServiceAccount: store-operator
