# Defaults. Environment differences live in deploy/gateway-values-*.yaml.

image:
  repository: gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Name of a Secret that already exists in this namespace, with two keys:
#   ADMIN_USERNAME, ADMIN_PASSWORD
# Used only on first start, to create the first admin. The chart never holds them.
existingSecret: gateway-admin

callTimeoutSeconds: 10
listTimeoutSeconds: 5
refreshIntervalSeconds: 30
# true when the gateway is served over https, so the session cookie is https-only.
cookieSecure: false

# SQLite on a volume. One replica only: SQLite is a single file with one writer.
persistence:
  size: 1Gi
  storageClass: ""

ingress:
  enabled: true
  className: traefik
  host: gateway.localhost

service:
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
