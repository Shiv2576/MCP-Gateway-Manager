[project]
name = "gateway"
version = "0.1.0"
description = "Team MCP gateway: one MCP endpoint in front of many upstream MCP servers."
requires-python = ">=3.12"
dependencies = [
    # MCP SDK: the server side for /mcp and the client side for upstreams.
    "mcp>=2.2,<3",
    "httpx2>=2.5",
    "anyio>=4",
    "uvicorn>=0.31",
    "starlette>=0.48",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Fernet: members' upstream credentials are encrypted at rest.
    "cryptography>=43",
    # Patterns with a timeout that release the GIL: a slow custom regex fails one call, not the pod.
    "regex>=2024.11.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
