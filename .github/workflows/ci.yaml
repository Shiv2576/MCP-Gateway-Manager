# Test every PR and push. Build only the images a change affects; on main, push them to
# GHCR tagged with the commit SHA and commit those tags into the prod values files.
# Argo CD deploys from there. See team-mcp-gateway/docs/gitops.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "team-mcp-gateway/docs/**"]
  workflow_dispatch: # "Run workflow": build and deploy all images (first run, or a rebuild)

# One main run at a time, so tag commits land in order; a newer PR run replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/shiv2576

jobs:
  # Which images this change affects, as a JSON list of names.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && '["gateway","dashboard","woo-mcp","store-operator"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway: team-mcp-gateway/services/gateway/**
            dashboard: team-mcp-gateway/services/dashboard/**
            woo-mcp: team-mcp-gateway/services/woo-mcp/**
            store-operator:
              - team-mcp-gateway/services/store-operator/**
              # copied into the operator image: it installs stores and edges from them
              - team-mcp-gateway/charts/store/**
              - team-mcp-gateway/charts/woo-mcp/**
              - team-mcp-gateway/charts/gateway/**

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, store-operator, woo-mcp]
    services:
      postgres: # for the gateway's tests
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: t }
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    defaults:
      run:
        working-directory: team-mcp-gateway/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:t@127.0.0.1:5433/postgres

  # On PRs this only checks that the affected images build (the dashboard's is its build check).
  images:
    needs: [changes, test]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'store-operator'
        run: helm dependency build team-mcp-gateway/charts/store # the operator image copies charts/store
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The operator builds from the repo root: its image also holds the charts.
          context: team-mcp-gateway/${{ matrix.name == 'store-operator' && '.' || format('services/{0}', matrix.name) }}
          file: team-mcp-gateway/services/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Git is the record of what runs: point the prod values at the images just pushed.
  # Services this change did not touch keep their tag, so Argo leaves their pods alone.
  deploy:
    needs: [changes, images]
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - working-directory: team-mcp-gateway/deploy
        env:
          TAG: ${{ github.sha }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          bump() { yq -i "$2 = strenv(TAG) | $2 style=\"double\"" "$1-values-prod.yaml"; }
          for s in $(jq -r '.[]' <<<"$SERVICES"); do
            case $s in
              gateway) bump gateway .image.tag; bump store-operator .edgeImageTag ;;  # edges run the gateway image
              woo-mcp) bump store-operator .wooMcpImage.tag ;;                       # the operator rolls it to every store
              *) bump "$s" .image.tag ;;
            esac
          done
      # Pushed with GITHUB_TOKEN, so this commit does not start another run.
      - env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: $(jq -r 'join(", ")' <<<"$SERVICES") at ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
